name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Lint code
        run: yarn lint

      - name: Run tests (Astro 6)
        run: yarn workspace @storybook-astro/integration-astro6 test

      - name: Run tests (Astro 5)
        run: yarn workspace @storybook-astro/integration-astro5 test

      - name: Build packages
        run: |
          rm -rf packages/@storybook-astro/renderer/dist
          rm -rf packages/@storybook-astro/framework/dist
          yarn build:packages

      - name: Smoke test (tarball / Astro 5 + 6)
        run: bash scripts/smoke-test.sh both fresh
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Pack packages
        run: |
          yarn workspace @storybook-astro/renderer pack --out /tmp/renderer.tgz
          yarn workspace @storybook-astro/framework pack --out /tmp/framework.tgz

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish renderer
        run: npm publish /tmp/renderer.tgz --tag beta --access public

      - name: Publish framework
        run: npm publish /tmp/framework.tgz --tag beta --access public

      - name: Promote to latest
        run: |
          yarn npm tag add @storybook-astro/renderer@$(node -p "require('./packages/@storybook-astro/renderer/package.json').version") latest
          yarn npm tag add @storybook-astro/framework@$(node -p "require('./packages/@storybook-astro/framework/package.json').version") latest
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
