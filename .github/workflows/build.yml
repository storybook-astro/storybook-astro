name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    # Pinned because ubuntu-latest moved to 26.04, where Playwright 1.60 can't
    # install Chromium. Move back once Playwright supports it.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint code
        run: yarn lint

      - name: Check doc references
        run: yarn lint:links

      - name: Build packages
        run: yarn build:packages

      - name: Build website
        run: yarn workspace @storybook-astro/website build

      - name: Run tests
        run: yarn test

      - name: Build Storybook (Astro 7)
        run: timeout 180 yarn workspace @storybook-astro/integration-astro7 build --test || test $? -eq 124
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Build Storybook (Astro 6)
        run: timeout 180 yarn workspace @storybook-astro/integration-astro6 build --test || test $? -eq 124
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Build Storybook (Astro 5)
        run: timeout 180 yarn workspace @storybook-astro/integration-astro5 build --test || test $? -eq 124
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Install Playwright browsers
        run: |
          # The runner's Ubuntu mirror sometimes can't be resolved, which fails
          # --with-deps. Retry it, then fall back to Chromium alone: the
          # ubuntu-24.04 image already has the libraries headless Chromium needs.
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install --with-deps failed (attempt $attempt)"
            sleep 20
          done
          npx playwright install chromium

      - name: Browser tests (Astro 7 static)
        run: yarn workspace @storybook-astro/integration-astro7 test:browser
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Browser tests (Astro 6 static)
        run: yarn workspace @storybook-astro/integration-astro6 test:browser
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Browser tests (Astro 5 static)
        run: yarn workspace @storybook-astro/integration-astro5 test:browser
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Storybook Test addon (Astro 7)
        run: yarn workspace @storybook-astro/integration-astro7 test:storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Storybook Test addon (Astro 6)
        run: yarn workspace @storybook-astro/integration-astro6 test:storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Storybook Test addon (Astro 5)
        run: yarn workspace @storybook-astro/integration-astro5 test:storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

  # Runs astro5, astro6 and astro7 against Storybook 11 (#205), since both
  # packages support 10 and 11; the framework and renderer unit suites run in
  # the astro7 leg. The versions are pinned in scripts/storybook-next-versions.json
  # so a new Storybook prerelease can't turn unrelated PRs red; the scheduled
  # Storybook next job tracks the newest. Every suite runs even after one fails,
  # so one run shows everything Storybook 11 breaks.
  storybook-11:
    # Pinned for the same reason as build-and-test.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        app: [astro7, astro6, astro5]

    env:
      APP: '@storybook-astro/integration-${{ matrix.app }}'
      STORYBOOK_DISABLE_TELEMETRY: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      # The pin script only reads and writes package.json, so one install
      # picks up the pinned versions.
      - name: Install the pinned Storybook 11 versions
        run: |
          node scripts/use-storybook-next.mjs --pinned
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Build packages
        run: yarn build:packages

      - name: Framework and renderer unit tests
        if: ${{ !cancelled() && matrix.app == 'astro7' }}
        run: |
          yarn workspace @storybook-astro/framework test
          yarn workspace @storybook-astro/renderer test

      - name: Component tests
        if: ${{ !cancelled() }}
        run: yarn workspace "$APP" test --run

      - name: Install Playwright browsers
        if: ${{ !cancelled() }}
        run: |
          # The runner's Ubuntu mirror sometimes can't be resolved, which fails
          # --with-deps. Retry it, then fall back to Chromium alone: the
          # ubuntu-24.04 image already has the libraries headless Chromium needs.
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install --with-deps failed (attempt $attempt)"
            sleep 20
          done
          npx playwright install chromium

      - name: Browser tests (static build)
        if: ${{ !cancelled() }}
        run: yarn workspace "$APP" test:browser

      - name: Storybook Test addon
        if: ${{ !cancelled() }}
        run: yarn workspace "$APP" test:storybook
