name: Build and Test

on:
  push:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Lint code
        run: yarn lint

      - name: Build packages
        run: yarn build:packages

      - name: Build website
        run: yarn workspace @storybook-astro/website build

      - name: Build Storybook (Astro 6)
        run: yarn workspace @storybook-astro/sandbox-astro6 build-storybook

      - name: Run tests (Astro 6)
        run: yarn workspace @storybook-astro/sandbox-astro6 test

      - name: Build Storybook (Astro 5)
        run: yarn workspace @storybook-astro/sandbox-astro5 build-storybook

      - name: Run tests (Astro 5)
        run: yarn workspace @storybook-astro/sandbox-astro5 test
