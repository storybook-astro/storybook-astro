name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Lint code
        run: yarn lint

      - name: Build packages
        run: yarn build:packages

      - name: Build website
        run: yarn workspace @storybook-astro/website build

      - name: Run tests
        run: yarn test

      - name: Build Storybook (Astro 6 static)
        continue-on-error: true
        run: timeout 180 yarn workspace @storybook-astro/integration-astro6 build-storybook -- --test || test $? -eq 124
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Build Storybook (Astro 5 static)
        continue-on-error: true
        run: timeout 180 yarn workspace @storybook-astro/integration-astro5 build-storybook -- --test || test $? -eq 124
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Build Storybook (Astro 6 server)
        continue-on-error: true
        run: timeout 180 yarn workspace @storybook-astro/integration-astro6-server build-storybook -- --test || test $? -eq 124
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Build Storybook (Astro 5 server)
        continue-on-error: true
        run: timeout 180 yarn workspace @storybook-astro/integration-astro5-server build-storybook -- --test || test $? -eq 124
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Interaction tests (Astro 6 static)
        run: yarn workspace @storybook-astro/integration-astro6 test:browser
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Interaction tests (Astro 5 static)
        run: yarn workspace @storybook-astro/integration-astro5 test:browser
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Interaction tests (Astro 6 server)
        run: yarn workspace @storybook-astro/integration-astro6-server test:browser
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

      - name: Interaction tests (Astro 5 server)
        run: yarn workspace @storybook-astro/integration-astro5-server test:browser
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1
